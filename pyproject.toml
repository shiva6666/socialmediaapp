[project]
name = "insta-clone-api"
version = "0.1.0"
description = "A FastAPI starter for a social app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "email-validator>=2.2,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "PyJWT>=2.9,<3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
